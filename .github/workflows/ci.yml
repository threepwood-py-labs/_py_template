name: Template CI

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:

jobs:
  validate-template:
    name: Validate Template
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Lint template policy script
        run: uvx ruff check template/scripts/policy/check_standard.py

      - name: Smoke render template
        run: |
          uvx copier copy --trust --defaults . .tmp_template_ci -d project_name=ci-smoke -d package_name=ci_smoke -d description="CI smoke template render"

      - name: Validate rendered template policy
        run: |
          git -C .tmp_template_ci init -b develop
          git -C .tmp_template_ci add -A
          python .tmp_template_ci/scripts/policy/check_standard.py

      - name: Validate rendered workflow quality steps
        run: |
          @'
          from pathlib import Path

          workflows_dir = Path(".tmp_template_ci/.github/workflows")
          ci_workflow = (workflows_dir / "ci.yml").read_text(encoding="utf-8")
          ci_required = [
              "hatch run lint:check",
              "hatch run lint:fmt",
              "hatch run lint:types",
              "hatch run lint:policy",
              "hatch run coverage report --fail-under",
          ]
          release_workflow = (workflows_dir / "release.yml").read_text(encoding="utf-8")
          release_required = [
              "scripts/windows/build_nuitka.py",
              "scripts/windows/package_release.py",
              "scripts/windows/build_onefile.py",
              "scripts/windows/package_onefile.py",
              "scripts/windows/write_release_checksums.py",
              "scripts/windows/verify_release_assets.py",
              "scripts/windows/smoke_launch.py",
          ]
          missing = [item for item in ci_required if item not in ci_workflow]
          missing += [item for item in release_required if item not in release_workflow]
          if missing:
              raise SystemExit(f"Missing required workflow checks: {missing}")
          '@ | python -
