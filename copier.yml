_answers_file: .copier-answers.yml
_subdirectory: template
_templates_suffix: .jinja
_tasks:
  - command: ["uv", "lock"]
    when: "{{ _copier_operation in ['copy', 'update'] }}"
_skip_if_exists:
  - .github/workflows/release.yml
  - LICENSE
  - README.md
  - docs/CHANGELOG.md
  - scripts/windows/package_release.py
  - src/*/__init__.py
  - src/*/__main__.py
_exclude:
  - python-project-standard-prompt.md

project_name:
  type: str
  help: Project directory and distribution name in kebab-case (e.g. my-project)

project_kind:
  type: str
  help: Project kind (`qt_app` or `shared_lib`)
  default: "qt_app"

package_name:
  type: str
  help: Python package name in snake_case (underscores)
  default: "{{ project_name | replace('-', '_') }}"

description:
  type: str
  help: Short project description

author_name:
  type: str
  help: Author name
  default: "Your Name"

author_email:
  type: str
  help: Author email
  default: "you@example.com"

github_username:
  type: str
  help: GitHub username
  default: "threepwood-py-labs"

project_version:
  type: str
  help: Project version
  default: "0.1.0"

runtime_dependencies:
  type: yaml
  help: Runtime dependency list
  default: []
